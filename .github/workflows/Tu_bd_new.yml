name: Build "turnip new"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: true
        type: string
      changes:
        description: 'Optional release highlights (Markdown). Overrides .github/release-notes/changes.md'
        required: false
        type: string

permissions:
  contents: write

jobs:
  start_building_turnip:
    runs-on: ubuntu-24.04
    env:
      BUILD_VERSION: ${{ inputs.version }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        # full history + tags so the release notes can list commits since the
        # previous release (see .github/scripts/generate-release-notes.sh)
        fetch-depth: 0

    - name: Prepare environment
      run: |
        sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
        sudo apt update
        sudo apt install build-essential flex bison glslang-tools
        sudo apt install meson-1.5 

    - name: Execute build script
      run: bash ./turnip_builder_new.sh

    - name: Generate release notes
      env:
        VARIANT: new
        RELEASE_CHANGES: ${{ inputs.changes }}
        ARTIFACTS: /tmp/Turnip-A81X-V${{ inputs.version }}.zip /tmp/Turnip-A81X-sync-V${{ inputs.version }}.zip
      run: bash .github/scripts/generate-release-notes.sh "$GITHUB_WORKSPACE/release-notes.md"

    - name: Release "turnip"
      uses: softprops/action-gh-release@v1
      with:
        body_path: release-notes.md
        tag_name: tu_v${{ inputs.version }}
        name: Turnip A81X V${{ inputs.version }}
        files: |
           /tmp/Turnip-A81X-V${{ inputs.version }}.zip
           /tmp/Turnip-A81X-sync-V${{ inputs.version }}.zip
